name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q judgecal
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end card
        run: |
          judgecal demo -o /tmp/demo.jsonl
          judgecal card /tmp/demo.jsonl -f html -o /tmp/card.html
          judgecal card /tmp/demo.jsonl --min-grade c
          judgecal probes -o /tmp/probes.jsonl
      - name: No third-party imports
        run: python scripts/check_stdlib_only.py
