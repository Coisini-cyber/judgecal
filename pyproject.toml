[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judgecal"
version = "0.1.0"
description = "Reliability cards for LLM judges: agreement, calibration, stability, and bias."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "judgecal contributors" }]
keywords = [
    "llm",
    "evaluation",
    "llm-as-a-judge",
    "calibration",
    "kappa",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Coisini-cyber/judgecal"
Issues = "https://github.com/Coisini-cyber/judgecal/issues"

[project.scripts]
judgecal = "judgecal.cli:main"

[tool.setuptools]
packages = ["judgecal"]
